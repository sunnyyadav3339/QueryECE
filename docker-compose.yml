services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATA_DIR=/data
    volumes:
      - ./backend:/app
      - ./data:/data
    # --reload for development; drop it for a production run.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # Keep the container's Linux build cache out of the host's frontend/.next;
      # sharing it breaks `npm run dev` on the host (every route 404s).
      - /app/.next
    depends_on:
      - backend
