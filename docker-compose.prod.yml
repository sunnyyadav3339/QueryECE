# Production stack (see DEPLOY.md):
#   docker compose -f docker-compose.prod.yml up -d --build
# Set DOMAIN in a .env file next to this one (e.g. DOMAIN=queryece.centralindia.cloudapp.azure.com).

services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      - DATA_DIR=/data
    volumes:
      - ./data:/data
    # One worker: the crawler/reminder scheduler must run exactly once.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips "*"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2.8
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - backend
      - frontend

volumes:
  caddy_data:
  caddy_config:
